version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /packages/agents/images/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The agent image stays on an Ubuntu LTS release; the base image moves by hand.
      - dependency-name: ubuntu
