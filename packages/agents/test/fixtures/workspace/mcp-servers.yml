# The MCP server binaries the tools server starts, pinned by release and
# checksum. Schema: schema/mcp-servers.schema.json. pnpm fetch-servers
# downloads them from the GitHub release and refuses a file whose sha256
# differs. To update one, change the version and every sha256 (from the
# release's asset digests, or its checksums file) in one pull request.

kubernetes-mcp-server:
  repository: containers/kubernetes-mcp-server
  version: 0.0.67
  platforms:
    linux-amd64:
      asset: kubernetes-mcp-server-linux-amd64
      sha256: d791c22b5367813cc9e7c66e405d8ff7f7d51189b5bd619fdd84a99cf7a1c116
    linux-arm64:
      asset: kubernetes-mcp-server-linux-arm64
      sha256: d9378039b68b5247796655ba8bbb210d5e94287e56bd532112d81950a19f0e50

github-mcp-server:
  repository: github/github-mcp-server
  version: 1.12.2
  platforms:
    linux-amd64:
      asset: github-mcp-server_Linux_x86_64.tar.gz
      sha256: 95843162759da2c31dde082dd145be35db82164594796c294414b69790c2290e
      binary: github-mcp-server
    linux-arm64:
      asset: github-mcp-server_Linux_arm64.tar.gz
      sha256: 2b30f9fcc061b57456cbe38ddc0f13c88863bad49557508a9196f2d1c4cb17a5
      binary: github-mcp-server
