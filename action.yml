name: flax agents run-job
description: Runs one job of a flax agents workspace in the sandbox (lbx) with the pinned agent image. The workspace is already checked out; the kit code the action runs is the workspace's dist/ bundle, built from @flax/agents by flax agents generate --dist.
inputs:
  job:
    description: The job name (a folder under jobs/).
    required: true
  workspace:
    description: The workspace root, relative to GITHUB_WORKSPACE.
    required: false
    default: "."
  args:
    description: The run-job flags after the job name (model, thinking, --out, --revise, collect inputs, ledger).
    required: false
    default: ""
  box-image:
    description: The pinned agent image, by digest (box.yml image).
    required: true
  box-repository:
    description: The sandbox repository, owner/name (flax.yml agents.sandbox.repo), whose release attaches the lbx binary.
    required: true
  box-release:
    description: The sandbox release tag box.yml pins (box_release).
    required: true
  box-sha256:
    description: The sha256 of the release's launcher binary (box.yml lbx_sha256); the binary is refused when it differs.
    required: true
  box-token:
    description: A token for a private sandbox repository; empty for a public one.
    required: false
    default: ""
  provider-plugin:
    description: The Pi provider plugin flax.yml names (agents.provider.plugin); the pinned image must carry it. Empty when the workspace uses Pi's own provider.
    required: false
    default: ""
  node-version:
    description: The Node version the runner bundle runs on.
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - name: Check the job and the pinned box
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: node dist/run-job.mjs ${{ inputs.job }} --preflight ${{ inputs.args }}
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Pull the pinned box image
      shell: bash
      env:
        BOX_IMAGE: ${{ inputs.box-image }}
      run: docker pull "$BOX_IMAGE"
    # The kit's own image ships no provider plugin; a workspace that names one
    # must pin an image built with it, or every model call fails in the box.
    - name: Check the image carries the provider plugin
      if: ${{ inputs.provider-plugin != '' }}
      shell: bash
      env:
        BOX_IMAGE: ${{ inputs.box-image }}
        PROVIDER_PLUGIN: ${{ inputs.provider-plugin }}
      run: |
        set -euo pipefail
        label() {
          docker image inspect --format "{{index .Config.Labels \"io.flax.agent-image.$1\"}}" "$BOX_IMAGE"
        }
        plugin="$(label provider-plugin)"
        if [ "$plugin" != "$PROVIDER_PLUGIN" ]; then
          echo "::error::the pinned agent image carries the provider plugin '${plugin:-none}', but flax.yml agents.provider.plugin names $PROVIDER_PLUGIN; the kit's own image has no provider plugin, so build the workspace's image from the kit's Dockerfile with PI_PROVIDER_PACKAGE=$PROVIDER_PLUGIN and pin that in box.yml"
          exit 1
        fi
        echo "agent image provider plugin: $plugin $(label provider-plugin-version)"
    - name: Download the sandbox (lbx) release binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.box-token != '' && inputs.box-token || github.token }}
        BOX_REPOSITORY: ${{ inputs.box-repository }}
        BOX_RELEASE: ${{ inputs.box-release }}
        BOX_SHA256: ${{ inputs.box-sha256 }}
      run: |
        set -euo pipefail
        case "$BOX_RELEASE" in
          v[0-9]*) ;;
          *) echo "::error::box_release $BOX_RELEASE is not a release tag vX.Y.Z"; exit 1 ;;
        esac
        binary=lbx-x86_64-unknown-linux-musl
        mkdir -p "$RUNNER_TEMP/box"
        gh release download "$BOX_RELEASE" --repo "$BOX_REPOSITORY" --pattern "$binary" --dir "$RUNNER_TEMP/box" --clobber
        echo "$BOX_SHA256  $RUNNER_TEMP/box/$binary" | sha256sum -c - || {
          echo "::error::$binary of $BOX_REPOSITORY release $BOX_RELEASE does not have the sha256 box.yml pins (lbx_sha256); refusing to run"
          exit 1
        }
        install -m 0755 "$RUNNER_TEMP/box/$binary" "$RUNNER_TEMP/box/lbx"
        echo "$RUNNER_TEMP/box" >> "$GITHUB_PATH"
        echo "sandbox $BOX_RELEASE: $binary $BOX_SHA256"
    - name: Run the job
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: node dist/run-job.mjs ${{ inputs.job }} --workspace . ${{ inputs.args }}
