# Tool definition. Schema: schema/tool.schema.json. Rules: docs/adding-a-tool.md.

name: gh-tree

description: Lists the files of one notes-co repository at one commit (its full 40-character sha), the whole tree or only under prefix, one per line as size in bytes, a tab and the path (submodules say submodule instead of a size), after a first line that counts them. At most max_paths lines (1000 when not given, at most 5000) and about 120 KB; the first line says when some were left out, so list a narrower prefix to see them.

arguments:
  type: object
  additionalProperties: false
  required: [repo, sha]
  properties:
    repo:
      type: string
      description: The repository name in notes-co, for example engine.
      maxLength: 100
      pattern: "^[A-Za-z0-9._-]+$"
    sha:
      type: string
      description: The commit's full 40-character sha.
      maxLength: 40
      pattern: "^[0-9a-f]{40}$"
    prefix:
      type: string
      description: Only paths under this directory, for example src/handlers.
      maxLength: 400
      pattern: "^[A-Za-z0-9._-][A-Za-z0-9._/=+()\\[\\]-]*$"
    max_paths:
      type: integer
      description: The most paths to return, 1000 when not given.
      minimum: 1
      maximum: 5000

# Served by the tools server with the run's read-only token: one fixed
# GET of repos/notes-co/{repo}/git/trees/{sha}?recursive=1.
upstream:
  server: github
  operations: [commit_tree]

# untrusted: path names at a commit that can be a fork's.
source: untrusted

result_max_bytes: 131072
