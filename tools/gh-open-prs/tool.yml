# Tool definition. Schema: schema/tool.schema.json. Rules: docs/adding-a-tool.md.

name: gh-open-prs

description: Lists the open pull requests across every notes-co repository, newest first, with number, title, author, link, draft flag and creation time; optionally only those of one author. The search is fixed; it takes no query.

arguments:
  type: object
  additionalProperties: false
  properties:
    author:
      type: string
      description: Only pull requests opened by this GitHub user.
      maxLength: 39
      pattern: "^[A-Za-z0-9-]+$"
    per_page:
      type: integer
      description: Results per page, 30 when not given.
      minimum: 1
      maximum: 100
    page:
      type: integer
      description: The page, 1 when not given.
      minimum: 1
      maximum: 10

# The query is fixed to org:notes-co is:pr is:open, plus the author;
# the GitHub upstream refuses any other.
upstream:
  server: github
  operations: [search_pull_requests]

# trusted: only text a person reviewed or our own systems wrote. untrusted:
# text anyone can write (pull request and issue bodies, Slack messages, log
# lines, web pages).
source: untrusted

result_max_bytes: 65536
