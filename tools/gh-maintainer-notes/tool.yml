# Tool definition. Schema: schema/tool.schema.json. Rules: docs/adding-a-tool.md.

name: gh-maintainer-notes

description: Returns the maintainer notes of one agents job's runs in the last days, newest first, at most 40 runs. Each run gives its id, branch, time and notes (each a kind and a short text the run's model wrote about missing data, missing tools, unclear instructions or limits it hit); a run whose notes could not be read is listed with the reason. The notes are model-written text.

arguments:
  type: object
  additionalProperties: false
  required: [job]
  properties:
    job:
      type: string
      description: The job's name, as in jobs/<name>/.
      maxLength: 41
      pattern: "^[a-z][a-z0-9-]{1,40}$"
    days:
      type: integer
      description: How many days back, 7 when not given.
      minimum: 1
      maximum: 14

# Read in the tools server with the run's read-only token, not through
# github-mcp-server: the job-<name>-maintainer-notes artifacts of
# agents only, each download from a host in github-log-hosts.yml.
upstream:
  server: github
  operations: [maintainer_notes_list]

# trusted: only text a person reviewed or our own systems wrote. untrusted:
# text anyone can write (pull request and issue bodies, Slack messages, log
# lines, web pages).
source: untrusted

result_max_bytes: 131072
