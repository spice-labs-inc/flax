# Job definition. Schema: schema/job.schema.json. Rules: docs/guardrails.md.
# After editing, run pnpm generate and pnpm check.

name: {{name}} # must equal the folder name

# GitHub handle that gets failure alerts.
owner: {{owner}}

# One sentence on what this job does.
purpose: Keeps the demo video scenarios (narration, steps and YouTube text) true to the product, as pull requests with the smallest evidence-backed edits, twice a week.

# Exactly one of:
#   schedule: "0 13 * * *"   five-field cron, UTC
#   after: other-job         runs when that job succeeds
#   manual: true             runs only when started by hand
# Mondays and Thursdays 16:00 UTC. Each run reads the 7 days before it, so
# the two runs overlap and nothing falls between them.
trigger:
  schedule: "0 16 * * 1,4"

# Must be listed in models.yml. A run started by hand can pick another.
model: {{model}}

# Pi thinking level for every run, one the model takes (models.yml). High:
# the task is a careful rule check with exact quotes and evidence for every
# changed line.
thinking: high

# true: Pi also gets a shell (bash) inside the box.
shell: true

limits:
  turns: 40 # at most 200
  tokens_per_run: 1000000 # at most 2000000
  usd_per_month: 8 # all jobs together share the workspace's monthly budget
  collect_tool_calls: 600 # tool calls collect.ts may make per run, at most 1000
  tool_seconds: 150 # seconds per tool call, at most 300; a diff of a repository with a committed bundle can take a minute

# Names of directories under tools/ the model may call. Tools are read-only.
# None: the model works from the collected input alone.
tools: []

# Names of directories under tools/ that collect.ts may call; needs collect.ts.
collect_tools:
  [
    gh-commits,
    gh-file,
    gh-merged-prs,
    gh-releases,
    gh-pull-requests,
    gh-compare,
  ]

# kind is one of:
#   file    the run's result is kept as a file; nothing else to set
#   slack   also set channel: <a channel from channels.yml>
#   pr      also set repos: [owner/name, ...] from repos.yml,
#           paths: [globs the job may change], max_changed_lines: <number>,
#           untrusted_input: report_only or open_pr, and optionally
#           frontmatter_keys and stamp_keys
# The paths and line limit must match collect.ts's RULES. A scenario file
# is code, so the PR checker lets a patch change only its string and
# number values, never ids, file paths, the voice or the agent scene.
# open_pr: collect.ts reads pull request diffs, which anyone can write, on
# every run, so report_only would never open anything; a person reviews
# every pull request, and the pull request says the model saw untrusted
# text. In shadow mode the run builds the pull request and keeps it in the
# report without opening it.
output:
  kind: pr
  repos: [{{repo}}]
  paths: [{{scenariosDir}}/*/scenario.ts]
  max_changed_lines: 120
  untrusted_input: open_pr
  review_team: {{reviewTeam}}

# shadow runs deliver nowhere public. live needs SHADOW_RUNS.md with 4 run
# links and code owner approval.
mode: shadow
